<!DOCTYPE html>
<html lang="{{ page.lang | default: "zh-CN" }}" class="html" data-theme="{{ site.theme_config.appearance | default: "auto" }}">
  {%- include head.html -%}
  <body>
    <div class="ambient-starfield" data-ambient-starfield aria-hidden="true">
      <canvas class="ambient-starfield-canvas" data-ambient-starfield-canvas></canvas>
    </div>
    <main class="page-content page-{{ page.layout | default: "default" }}" aria-label="Content">
      <div class="w">
        {{ content }}
        {% if site.theme_config.appearance_toggle %}
          {% include toggle_theme_button.html %}
        {% endif %}
        <div class="credits">
          {%- if site.theme_config.show_copyright == true -%}
            &copy;&nbsp;{{ "now" | date: "%Y" }}&nbsp;{{ site.author }}
            &nbsp;&middot;&nbsp;
          {%- endif -%}
          Theme&nbsp;<a href="https://github.com/abhinavs/moonwalk" target="_blank" rel="noreferrer">Moonwalk</a>
        </div>
      </div>
    </main>
    <script src="{{ "/assets/js/ambient-starfield.js" | relative_url }}" defer></script>
  </body>
</html>
