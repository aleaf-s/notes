<text x="725" y="847" fill="#52647a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="725" dy="0">前景人脸更亮</tspan><tspan x="725" dy="38">窗外部分信号截断</tspan></text>
<text x="725" y="944" fill="#2764aa" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="725" dy="0">曝光倍数 ×2.5</tspan></text>
<text x="560" y="1065" fill="#2764aa" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">关注某一区域，并不会让其他区域免受曝光变化的影响。</tspan></text>
<text x="48" y="1105" fill="#52647a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="48" dy="0">原创合成示意 · 非相机实拍、非海思输出，也不代表三种 AE 策略必然产生这些倍数。</tspan></text>
