<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="880" viewBox="0 0 1120 880" role="img">
<title>像素没有改变，改变的是它们在测光中的分量</title><desc>教学例子：90 个像素亮度为 40，另 10 个像素亮度为 200。</desc>
