---
layout: default
title: 学习笔记
---

<div class="accordion-container">
  <h1>学习笔记</h1>
  <p>所有笔记，转载请注明地址~</p>
  <hr>

  {% for category in site.categories %}
    <section class="accordion-section">
      <button
        class="accordion-header"
        type="button"
        aria-expanded="false"
        aria-controls="category-panel-{{ forloop.index }}"
      >
        {{ category | first }}
      </button>
      <div class="accordion-panel" id="category-panel-{{ forloop.index }}">
        <ul class="post-list-in-accordion">
          {% for post in category.last %}
            <li>
              <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
              <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
            </li>
          {% endfor %}
        </ul>
      </div>
    </section>
  {% endfor %}

  <a href="{{ '/' | relative_url }}" class="back-link">&larr; 返回主页</a>
</div>

<script src="{{ "/assets/js/blog.js" | relative_url }}" defer></script>
